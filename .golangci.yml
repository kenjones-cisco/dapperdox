version: "2"

linters:
  settings:
    importas:
      alias:
        - pkg: k8s.io/api/apps/v1
          alias: appv1
        - pkg: k8s.io/api/core/v1
          alias: v1
        - pkg: k8s.io/apimachinery/pkg/apis/meta/v1
          alias: metav1
  exclusions:
    rules:
      - path: ^main\.go$
        text: forbidden by pattern
        linters:
          - forbidigo

formatters:
  settings:
    goimports:
      local-prefixes:
        - github.com/kenjones-cisco/dapperdox/
